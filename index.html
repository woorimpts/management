<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경영지원부 업무 계획</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body class="locked">
  <div id="lock" class="lock">
    <form id="lockForm" class="lock-card" autocomplete="off">
      <div class="lock-icon">🔒</div>
      <h1>경영지원부 업무 계획</h1>
      <p>공유받은 비밀번호를 입력해 주세요.</p>
      <input id="lockPw" type="password" placeholder="비밀번호" required>
      <label class="switch"><input type="checkbox" id="lockRemember" checked><span>이 기기에서 기억하기</span></label>
      <button type="submit">들어가기</button>
      <div id="lockMsg" class="lock-msg" role="alert"></div>
    </form>
  </div>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>경영지원부 업무 계획</h1>
        <span id="syncStatus" class="sync"><i></i><b>연결 중…</b></span>
      </div>
      <div class="month-nav">
        <button id="prevMonth" class="icon-btn" aria-label="이전 달">‹</button>
        <strong id="monthLabel"></strong>
        <button id="nextMonth" class="icon-btn" aria-label="다음 달">›</button>
        <button id="todayBtn" class="ghost-btn">오늘</button>
      </div>
      <label class="who">
        <span>내 이름</span>
        <input id="userName" type="text" placeholder="이름 입력" maxlength="20" autocomplete="name">
      </label>
    </div>
  </header>

  <main class="wrap">
    <div class="action-bar">
      <button class="btn primary" data-add-task="">+ 업무 추가</button>
      <button class="btn me" data-add-personal="">👤 개인 일정</button>
      <button class="btn vac" data-add-vac="">🌴 휴가 등록</button>
      <button class="btn" data-add-note="">📢 공지 등록</button>
      <button class="btn" id="uploadBtn">📤 엑셀 업로드</button>
      <button class="btn" id="downloadBtn">📥 엑셀 다운로드</button>
      <button class="btn lock-btn" id="pLockBtn">🔒 내 비공개 일정 열기</button>
    </div>

    <section class="summary" id="summary"></section>

    <div class="toolbar">
      <div class="chips" id="deptFilters"></div>
      <div class="toolbar-right">
        <label class="switch"><input type="checkbox" id="showPersonal"><span>개인 일정</span></label>
        <label class="switch"><input type="checkbox" id="showVac"><span>휴가 보기</span></label>
        <label class="switch"><input type="checkbox" id="hideDone"><span>완료 숨기기</span></label>
        <div class="seg" role="tablist">
          <button data-view="calendar" class="on">달력</button>
          <button data-view="list">목록</button>
        </div>
      </div>
    </div>

    <div class="layout" id="calendarView">
      <section class="cal">
        <div class="cal-head" id="calHead"></div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
      <aside class="day-panel" id="dayPanel"></aside>
    </div>

    <section class="list-view" id="listView" hidden></section>

    <section class="extra" id="extra"></section>
  </main>

  <div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="firebase-config.js?v=11"></script>
  <script src="lock.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
